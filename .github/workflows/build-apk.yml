name: Build MapRelay APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$RUNNER_TEMP"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p android-tools
          unzip -q commandlinetools-linux-11076708_latest.zip -d android-tools
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -r android-tools/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir -p "$RUNNER_TEMP/maprelay"
          unzip -q MapRelay-cloud-build-fixed.zip -d "$RUNNER_TEMP/maprelay"

      - name: Build APK
        run: |
          gradle -p "$RUNNER_TEMP/maprelay/MapRelay" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MapRelay-debug-apk
          path: ${{ runner.temp }}/maprelay/MapRelay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
