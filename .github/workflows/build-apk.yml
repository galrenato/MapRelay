
name: Build MapRelay APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$RUNNER_TEMP"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p android-tools
          unzip -q commandlinetools-linux-11076708_latest.zip -d android-tools
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -r android-tools/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p "$RUNNER_TEMP/maprelay"
          unzip -q MapRelay-cloud-build-fixed.zip -d "$RUNNER_TEMP/maprelay"

      - name: Copy updated Tesla-first Kotlin source
        run: |
          cp MapRelay/app/src/main/java/com/example/maprelay/ShareActivity.kt \
            "$RUNNER_TEMP/maprelay/MapRelay/app/src/main/java/com/example/maprelay/ShareActivity.kt"

      - name: Install MapRelay logo
        run: |
          mkdir -p "$RUNNER_TEMP/maprelay/MapRelay/app/src/main/res/drawable-nodpi"
          cp MapRelay/app/src/main/res/drawable-nodpi/ic_maprelay.jpg \
            "$RUNNER_TEMP/maprelay/MapRelay/app/src/main/res/drawable-nodpi/ic_maprelay.jpg"

      - name: Configure application and sharing icons
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "/tmp/unused"
          )
          import os
          manifest = Path(os.environ["RUNNER_TEMP"]) / "maprelay/MapRelay/app/src/main/AndroidManifest.xml"
          content = manifest.read_text()

          content = content.replace(
              '<application\n',
              '<application\n        android:icon="@drawable/ic_maprelay"\n        android:roundIcon="@drawable/ic_maprelay"\n',
              1
          )

          content = content.replace(
              '<activity\n',
              '<activity\n            android:icon="@drawable/ic_maprelay"\n',
              1
          )

          manifest.write_text(content)
          print("Application and sharing icons configured.")
          PY

      - name: Build APK
        run: |
          gradle -p "$RUNNER_TEMP/maprelay/MapRelay" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MapRelay-debug-apk
          path: ${{ runner.temp }}/maprelay/MapRelay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
